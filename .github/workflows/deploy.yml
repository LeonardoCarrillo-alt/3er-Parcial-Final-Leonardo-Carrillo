name: Deploy Duelo de Cristales

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (client)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/client/package-lock.json

      - name: Setup Node.js (server)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/server/package-lock.json

      - name: Instalar dependencias (client)
        working-directory: duelo-de-cristales/client
        run: npm ci

      - name: Instalar dependencias (server)
        working-directory: duelo-de-cristales/server
        run: npm ci

      - name: Lint client
        working-directory: duelo-de-cristales/client
        run: npm run lint

      - name: Lint server
        working-directory: duelo-de-cristales/server
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (raíz)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Node.js (client)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/client/package-lock.json

      - name: Setup Node.js (server)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/server/package-lock.json

      - name: Instalar dependencias (raíz)
        run: npm ci

      - name: Instalar dependencias (client)
        working-directory: duelo-de-cristales/client
        run: npm ci

      - name: Instalar dependencias (server)
        working-directory: duelo-de-cristales/server
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build de producción (client + server)
        run: npm run build

      - name: Iniciar servidor de producción
        run: |
          NODE_ENV=production node duelo-de-cristales/server/dist/index.js > server.log 2>&1 &
          npx wait-on http://localhost:3001/api/health -t 60000

      - name: Ejecutar tests E2E
        env:
          CI: "true"
          BASE_URL: http://localhost:3001
          PW_SKIP_SERVERS: "1"
        run: npx playwright test --config=playwright.config.ts --project=chromium

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (client)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/client/package-lock.json

      - name: Setup Node.js (server)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duelo-de-cristales/server/package-lock.json

      - name: Instalar dependencias (client)
        working-directory: duelo-de-cristales/client
        run: npm ci

      - name: Instalar dependencias (server)
        working-directory: duelo-de-cristales/server
        run: npm ci

      - name: Construir Frontend y compilar Backend
        run: npm run build

      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -f -sS -X POST "$RENDER_DEPLOY_HOOK_URL"